version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fx_postgres
    restart: always
    environment:
      POSTGRES_USER: fx_user
      POSTGRES_PASSWORD: fx_password
      POSTGRES_DB: fx_dashboard
    ports:
      - '5432:5432'
    volumes:
      - fx_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  fx_postgres_data: